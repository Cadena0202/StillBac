<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Dictionary</title>

  <style>

    /* =========================================
       WORLD / DICTIONARY
       ========================================= */

    :root{
      --paper:#f8f7f2;
      --paper-deep:#eeeae0;

      --ink:#172b4d;
      --ink-light:rgba(23,43,77,.62);
      --ink-faint:rgba(23,43,77,.28);

      --line:rgba(23,43,77,.38);

      --modal-bg:rgba(248,247,242,.97);
    }


    /* =========================================
       基本
       ========================================= */

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
    }

    body{
      background:var(--paper);
      color:var(--ink);

      font-family:
        "Times New Roman",
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;

      -webkit-font-smoothing:antialiased;
    }


    /* =========================================
       ページフェード
       ========================================= */

    #world-fade{
      position:fixed;
      inset:0;
      z-index:9999;

      background:#05070b;

      pointer-events:none;

      animation:worldFadeOut 1.2s ease forwards;
    }

    @keyframes worldFadeOut{
      0%{
        opacity:1;
      }

      100%{
        opacity:0;
      }
    }


    /* =========================================
       ページ
       ========================================= */

    .dictionary-page{
      width:100%;
      min-height:100vh;

      padding:
        11vh
        8vw
        12vh;

      background:
        linear-gradient(
          rgba(255,255,255,.20),
          rgba(238,234,224,.16)
        ),
        var(--paper);
    }


    /* =========================================
       ヘッダー
       ========================================= */

    .dictionary-header{
      width:100%;
      max-width:760px;

      margin:0 auto;
    }


    /* =========================================
       dictionary
       ========================================= */

    .dictionary-title{
      text-align:center;

      color:var(--ink);

      font-family:
        "Snell Roundhand",
        "Segoe Script",
        "Brush Script MT",
        cursive;

      font-size:clamp(50px,12vw,90px);

      font-weight:400;

      letter-spacing:.025em;

      line-height:1;

      margin-bottom:7vh;
    }


    /* =========================================
       検索
       ========================================= */

    .search-area{
      width:100%;

      display:flex;
      flex-direction:column;
      align-items:center;

      gap:16px;
    }

    #world-search{
      width:100%;
      max-width:480px;

      min-height:42px;

      padding:9px 14px;

      border:1px solid var(--line);
      border-radius:24px;

      background:rgba(255,255,255,.35);

      color:var(--ink);

      font-family:inherit;
      font-size:16px;
      line-height:1.4;

      outline:none;

      -webkit-appearance:none;
      appearance:none;
    }

    #world-search::placeholder{
      color:var(--ink-faint);
    }

    #world-search:focus{
      border-color:var(--ink-light);
    }

    #search-button{
      min-width:80px;
      min-height:44px;

      padding:8px 18px;

      border:none;

      background:transparent;

      color:var(--ink);

      font-family:inherit;
      font-size:16px;

      letter-spacing:.08em;

      cursor:pointer;
    }
    #search-button:active{
      background:rgba(23,43,77,.07);
    }


    /* =========================================
       カテゴリ
       ========================================= */

    .category-list{
      width:100%;
      max-width:760px;

      margin:9vh auto 0;

      display:flex;
      flex-wrap:wrap;

      justify-content:center;

      gap:10px 22px;

      border-top:1px solid var(--ink-faint);

      padding-top:22px;
    }

    .category-button{
      appearance:none;
      border:0;

      padding:5px 2px;

      background:transparent;

      color:var(--ink);

      font-family:inherit;
      font-size:11px;

      letter-spacing:.12em;

      cursor:pointer;

      opacity:.72;

      transition:
        opacity .25s ease,
        letter-spacing .25s ease;

      -webkit-tap-highlight-color:transparent;
    }

    .category-button:hover{
      opacity:1;
    }

    .category-button.active{
      opacity:1;
      letter-spacing:.18em;
    }

    .fixed-world-links{
      display:flex;
      justify-content:center;
      gap:0;

      margin-top:18px;
      margin-bottom:6px;
    }

    .fixed-world-button{
      width:130px;
      text-align:center;

      appearance:none;
      border:0;
      padding:5px 2px;

      background:transparent;
      color:var(--ink);

      font-family:inherit;
      font-size:13px;
      letter-spacing:.12em;

      cursor:pointer;
      opacity:.72;

      -webkit-tap-highlight-color:transparent;
    }


    /* =========================================
       結果
       ========================================= */

    .result-area{
      width:100%;
      max-width:760px;

      margin:8vh auto 0;
    }

    .result-label{
      margin-bottom:24px;

      color:var(--ink-light);

      font-family:
        Arial,
        sans-serif;

      font-size:11px;

      letter-spacing:.18em;
    }

    .world-results{
      width:100%;
    }


    /* =========================================
       記事一覧
       ========================================= */

    .result-entry{
      width:100%;

      padding:18px 2px;

      border-bottom:1px solid var(--ink-faint);

      cursor:pointer;

      -webkit-tap-highlight-color:transparent;

      transition:
        padding-left .25s ease,
        opacity .25s ease;
    }

    .result-entry:first-child{
      border-top:1px solid var(--ink-faint);
    }

    .result-entry:active{
      padding-left:8px;
    }

    .result-entry-title{
      color:var(--ink);

      font-size:11px;

      line-height:1.6;
    }

    .result-entry-meta{
      margin-top:5px;

      color:var(--ink-light);

      font-family:Arial,sans-serif;

      font-size:8px;

      letter-spacing:.13em;

      text-transform:uppercase;
    }

    .loading-text,
    .empty-text{
      padding:30px 0;

      color:var(--ink-light);

      font-size:14px;

      text-align:center;
    }


    /* =========================================
       モーダル
       ========================================= */

    .article-modal{
      position:fixed;
      inset:0;

      z-index:10000;

      display:flex;

      align-items:center;
      justify-content:center;

      padding:5vh 12vw;

      opacity:0;
      visibility:hidden;

      transition:
        opacity .35s ease,
        visibility .35s ease;
    }

    .article-modal.open{
      opacity:1;
      visibility:visible;
    }


    /* 背景 */

    .modal-backdrop{
      position:absolute;
      inset:0;

      background:rgba(5,9,16,.48);

      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }


    /* 記事本体 */

    .article-window{
      position:relative;

      z-index:1;

      width:100%;
      max-width:720px;

      max-height:86vh;

      overflow-y:auto;

      padding:
        42px
        54px
        38px;

      background:var(--modal-bg);

      border:1px solid var(--line);

      box-shadow:
        0 18px 60px rgba(0,0,0,.16);

      animation:articleOpen .35s ease;
    }

    @keyframes articleOpen{
      from{
        opacity:0;
        transform:translateY(12px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }


    /* =========================================
       閉じる
       ========================================= */

    .modal-close{
      position:absolute;

      top:12px;
      right:16px;

      width:36px;
      height:36px;

      padding:0;

      border:0;

      background:transparent;

      color:var(--ink);

      font-family:Arial,sans-serif;
      font-size:25px;
      font-weight:200;

      cursor:pointer;

      opacity:.65;
    }


    /* =========================================
       記事
       ========================================= */

    .article-category{
      margin-bottom:12px;

      color:var(--ink-light);

      font-family:Arial,sans-serif;

      font-size:10px;

      letter-spacing:.18em;

      text-transform:uppercase;
    }

    .article-title{
      margin:0;

      color:var(--ink);

      font-size:clamp(18px,3.5vw,24px);

      font-weight:400;

      line-height:1.35;
    }

    .article-line{
      width:100%;

      height:1px;

      margin:24px 0 28px;

      background:var(--ink-faint);
    }

    .article-body{
      color:var(--ink);

      font-size:10px;

      line-height:2;

      white-space:pre-wrap;
    }


    /* =========================================
       関連
       ========================================= */

    .related-area{
      margin-top:45px;
    }

    .related-title{
      margin-bottom:14px;

      color:var(--ink-light);

      font-family:Arial,sans-serif;

      font-size:12px;

      letter-spacing:.18em;
    }

    .related-list{
      display:flex;
      flex-direction:column;
    }

    .related-link{
      padding:11px 0;

      border-bottom:1px solid var(--ink-faint);

      color:var(--ink);

      font-size:9px;

      cursor:pointer;

      -webkit-tap-highlight-color:transparent;
    }

    .related-link:first-child{
      border-top:1px solid var(--ink-faint);
    }

    .related-link:active{
      padding-left:7px;
    }


    /* =========================================
       スマホ
       ========================================= */

    @media (max-width:600px){

      .dictionary-page{
        padding:
          9vh
          7vw
          10vh;
      }

      .dictionary-title{
        margin-bottom:6vh;
      }

      .category-list{
        margin-top:2vh;

        gap:12px 18px;
      }

      .result-area{
        margin-top:6vh;
      }

      .article-modal{
        padding:4vh 8vw;
      }

      .article-window{
        max-height:90vh;

        padding:
          40px 34px 30px;
      }
    }

  </style>
</head>


<body>

  <!-- =========================================
       ページフェード
       ========================================= -->

  <div id="world-fade"></div>


  <!-- =========================================
       Dictionary本体
       ========================================= -->

  <main class="dictionary-page">

    <header class="dictionary-header">

      <div class="dictionary-title">
        dictionary
      </div>


      <div class="search-area">

        <input
          type="search"
          id="world-search"
          placeholder="キーワードで検索"
          autocomplete="off"
          enterkeyhint="search"
        >

        <button
          id="search-button"
          type="button"
        >
          check
        </button>

      </div>

    </header>


    <!-- カテゴリ -->
    <div class="fixed-world-links">
      <button
        class="fixed-world-button"
        id="main-story-button"
        type="button"
        >
        MAIN STORY
      </button>

      <button
        class="fixed-world-button"
        id="events-button"
        type="button"
        >
        EVENTS
      </button>
    </div>
    
    <nav
      id="category-list"
      class="category-list"
    >
      <!-- JSで自動生成 -->
    </nav>

    <section class="result-area">
    <div id="world-results" class="world-results"></div>
    </section>

  </main>


  <!-- =========================================
       記事モーダル
       ========================================= -->

  <div
    id="article-modal"
    class="article-modal"
  >

    <div
      class="modal-backdrop"
      id="modal-backdrop"
    ></div>


    <article class="article-window">

      <button
        type="button"
        id="modal-close"
        class="modal-close"
        aria-label="close"
      >
        ×
      </button>


      <div
        id="article-category"
        class="article-category"
      ></div>


      <h1
        id="article-title"
        class="article-title"
      ></h1>


      <div class="article-line"></div>


      <div
        id="article-body"
        class="article-body"
      ></div>


      <div
        id="related-area"
        class="related-area"
      >

        <div class="related-title">
          RELATED
        </div>

        <div
          id="related-list"
          class="related-list"
        ></div>

      </div>

    </article>

  </div>


  <!-- =========================================
       Firebase + Dictionary JS
       ========================================= -->

  <script type="module">

    /* =========================================
       Firebase
       ========================================= */

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
      getFirestore,
      collection,
      getDocs
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* =========================================
       Firebase設定
       ========================================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyDeO0QZ1wmxGmEcyu9W3SgSos1Y4T-4TYA",

      authDomain:
        "azul-1a3c9.firebaseapp.com",

      projectId:
        "azul-1a3c9",

      storageBucket:
        "azul-1a3c9.firebasestorage.app",

      messagingSenderId:
        "107176111624",

      appId:
        "1:107176111624:web:78bc25fbe09bcd3b47ebbd"
    };


    const app =
      initializeApp(firebaseConfig);


    const db =
      getFirestore(app);


    /* =========================================
       DOM
       ========================================= */

    const searchInput =
      document.getElementById("world-search");

    const searchButton =
      document.getElementById("search-button");

    const categoryList =
      document.getElementById("category-list");

    const resultLabel =
      document.getElementById("result-label");

    const results =
      document.getElementById("world-results");

    const modal =
      document.getElementById("article-modal");

    const modalBackdrop =
      document.getElementById("modal-backdrop");

    const modalClose =
      document.getElementById("modal-close");

    const articleCategory =
      document.getElementById("article-category");

    const articleTitle =
      document.getElementById("article-title");

    const articleBody =
      document.getElementById("article-body");

    const relatedList =
      document.getElementById("related-list");


    /* =========================================
       データ
       ========================================= */

    let allEntries = [];

    let currentCategory = "ALL";

    /* =========================================
       Firestoreから取得
       ========================================= */

    async function loadWorldEntries(){

      try{

        const snapshot =
          await getDocs(
            collection(db, "world")
          );


        allEntries =
          snapshot.docs.map(doc => {

            const data =
              doc.data();


            return {

              id:doc.id,

              title:
                data.title || "",

              category:
                Array.isArray(data.category)
                  ? data.category
                  : data.category
                    ? [data.category]
                    : [],

              body:
                data.body || "",

              keywords:
                Array.isArray(data.keywords)
                  ? data.keywords
                  : [],

              related:
                Array.isArray(data.related)
                  ? data.related
                  : [],

              type:
                data.type || "",
                
              order:
                data.order ?? 999

            };

          });


        createCategories();

      }catch(error){

        console.error(
          "WORLD FIRESTORE ERROR:",
          error
        );


        results.innerHTML = `

          <div class="empty-text">

            unable to load dictionary

          </div>

        `;

      }

    }


    /* =========================================
       カテゴリ生成
       ========================================= */

    function createCategories(){

      const categories = [
        ...new Set(
          allEntries
          .map(entry => entry.category)
          .filter(category =>
            category &&
            category !== "STORY" &&
            category !== "EVENT"
                 )
        )
      ];

      categoryList.innerHTML = "";


      categories.forEach(category => {

        const button =
          document.createElement("button");


        button.type =
          "button";


        button.className =
          "category-button";


        if(
          category ===
          currentCategory
        ){

          button.classList.add(
            "active"
          );

        }


        button.textContent =
          category;


        button.addEventListener(
          "click",
          () => {

            currentCategory =
              category;


            document
              .querySelectorAll(
                ".category-button"
              )
              .forEach(btn => {

                btn.classList.remove(
                  "active"
                );

              });


            button.classList.add(
              "active"
            );


            searchEntries();

          }
        );


        categoryList.appendChild(
          button
        );

      });

    }


    /* =========================================
       検索
       ========================================= */

    function searchEntries(){

      const keyword =
        searchInput.value
          .trim()
          .toLowerCase();


      const filtered =
        allEntries.filter(entry => {


          if(

            currentCategory !==
            "ALL"

            &&

            !entry.category.includes(currentCategory)

          ){

            return false;

          }


          if(!keyword){

            return true;

          }


          const searchable = [

            entry.title,

            entry.category,

            entry.body,

            entry.type,

            ...entry.keywords,

            ...entry.related

          ]

          .join(" ")

          .toLowerCase();


          return searchable.includes(
            keyword
          );

        });

      filtered.sort((a, b) => a.order - b.order);

      showEntries(
        filtered
      );

    }


    /* =========================================
       記事一覧表示
       ========================================= */

    function showEntries(entries){

      results.innerHTML =
        "";

      if(
        entries.length === 0
      ){

        results.innerHTML = `

          <div class="empty-text">
            no entries found
          </div>

        `;

        return;

      }


      entries.forEach(entry => {


        const item =
          document.createElement(
            "div"
          );


        item.className =
          "result-entry";


        const title =
          document.createElement(
            "div"
          );

        title.className =
          "result-entry-title";

        title.textContent =
          entry.title;


        const meta =
          document.createElement(
            "div"
          );

        meta.className =
          "result-entry-meta";

        meta.textContent =
          entry.category;


        item.appendChild(
          title
        );

        item.appendChild(
          meta
        );


        item.addEventListener(
          "click",
          () => {

            openArticle(
              entry
            );

          }
        );


        results.appendChild(
          item
        );

      });

    }


    /* =========================================
       記事モーダル
       ========================================= */

    function openArticle(entry){

      articleCategory.textContent =
        entry.category ||
        entry.type ||
        "";


      articleTitle.textContent =
        entry.title;


      articleBody.textContent =
        entry.body;


      relatedList.innerHTML =
        "";


      if(
        entry.related.length > 0
      ){

        const relatedEntries =

          entry.related

            .map(name => {

              return allEntries.find(
                item => {
                  console.log(
                    "比較:",
                    JSON.stringify(item.title),
                    JSON.stringify(name)
                  );

                  return item.title.toLowerCase() ===
                    String(name).toLowerCase();
                }
              );

            })

            .filter(Boolean);

        console.log("related:", entry.related);
        console.log("relatedEntries:", relatedEntries);


        relatedEntries.forEach(
          related => {


            const link =
              document.createElement(
                "div"
              );


            link.className =
              "related-link";


            link.textContent =
              related.title;


            link.addEventListener(
              "click",
              () => {

                openArticle(
                  related
                );

              }
            );


            relatedList.appendChild(
              link
            );

          }
        );

      }


      if(
        relatedList.children.length ===
        0
      ){

        relatedList.innerHTML = `

          <div class="empty-text">
            —
          </div>

        `;

      }


      modal.classList.add(
        "open"
      );


      document.body.style.overflow =
        "hidden";

    }


    /* =========================================
       モーダルを閉じる
       ========================================= */

    function closeArticle(){

      modal.classList.remove(
        "open"
      );


      document.body.style.overflow =
        "";

    }


    modalClose.addEventListener(
      "click",
      closeArticle
    );


    modalBackdrop.addEventListener(
      "click",
      closeArticle
    );


    /* =========================================
       検索イベント
       ========================================= */

    searchButton.addEventListener(
      "click",
      searchEntries
    );


    searchInput.addEventListener(
      "keydown",
      event => {

        if(
          event.key ===
          "Enter"
        ){

          searchEntries();

        }

      }
    );


    /* =========================================
       起動
       ========================================= */

    document.getElementById("main-story-button")
      .addEventListener("click", () => {
        currentCategory = "STORY";

        showEntries(
          allEntries.filter(entry =>
            entry.category === "STORY"
                           )
        );
      });
    document
      .getElementById("events-button")
      .addEventListener("click", () => {

        currentCategory = "EVENT";
        showEntries(
          allEntries.filter(entry =>
            entry.category === "EVENT"
                           )
        );
      });
    
    loadWorldEntries();

  </script>

</body>
</html>
